lakehouse_profile: 
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      user: "{{ env_var('LAKEHOUSE_USER') }}"
      host: "{{ env_var('TRINO_HOST') }}"
      port: "{{ env_var('TRINO_PORT') | int }}"
      catalog: "{{ env_var('TRINO_CATALOG') }}"
      schema: "{{ env_var('TRINO_SCHEMA') }}"