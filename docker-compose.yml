version: '3.8'

services:
  # MongoDB for Nessie Catalog
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ilaybor
      MONGO_INITDB_ROOT_PASSWORD: 24342434
      MONGO_INITDB_DATABASE: nessie
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - trino-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Nessie Iceberg Catalog
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NESSIE_VERSION_STORE_TYPE: MONGODB
      QUARKUS_MONGODB_DATABASE: nessie
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://ilaybor:24342434@mongodb:27017/nessie?authSource=admin
      QUARKUS_OTEL_SDK_DISABLED: "true"
    ports:
      - "19120:19120"
    networks:
      - trino-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19120/api/v2/config || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ilaybor
      MINIO_ROOT_PASSWORD: 24342434
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - trino-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Trino Coordinator
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/trino/catalog:/etc/trino/catalog
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - trino-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Postgres for metabase
  postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ilaybor
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: 24342434
    networks:
      - trino-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  # Metabase
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    ports:
      - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: ilaybor
      MB_DB_PASS: 24342434
      MB_DB_HOST: postgres
    networks:
      - trino-network
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres


volumes:
  mongodb_data:
  minio_data:
  postgres_data:

networks:
  trino-network:
    driver: bridge