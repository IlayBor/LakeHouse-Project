version: '3.8'

services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ilaybor
      MINIO_ROOT_PASSWORD: 24342434
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - trino-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create default bucket called "warehouse"
  createbuckets:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 ilaybor 24342434;
      /usr/bin/mc mb --ignore-existing dockerminio/warehouse;
      exit 0;
      "
    networks:
      trino-network:

  # Postgres for LakeKeeper Catalog
  lakekeeper-postgres:
    image: postgres:17
    container_name: lakekeeper-postgres
    hostname: lakekeeper-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ilaybor
      POSTGRES_DB: lakekeeper_catalog
      POSTGRES_PASSWORD: 24342434
    networks:
      - trino-network
    volumes:
      - lakekeeper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ilaybor -p 5432 -d lakekeeper_catalog" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 10s

  # Lakekeeper Iceberg Catalog
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    pull_policy: always
    container_name: lakekeeper
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &lakekeeper-environment
      LAKEKEEPER__CATALOG__DATABASE__POSTGRES__CONNECTION_STRING: "postgres://ilaybor:24342434@lakekeeper-postgres:5432/lakekeeper_catalog"
      LAKEKEEPER__AUTH__OIDC_PROVIDER_URI: "" 
      LAKEKEEPER__PG_ENCRYPTION_KEY: This-is-NOT-Secure!
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://ilaybor:24342434@lakekeeper-postgres:5432/lakekeeper_catalog
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://ilaybor:24342434@lakekeeper-postgres:5432/lakekeeper_catalog
      LAKEKEEPER__AUTHZ_BACKEND: allowall
    ports:
      - "8181:8181"
    networks:
      - trino-network
    command: [ "serve" ]
    hostname: lakekeeper
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 3s

  # Lakekeeper Init
  migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    pull_policy: always
    environment: *lakekeeper-environment
    restart: "no"
    command: [ "migrate" ]
    depends_on:
      lakekeeper-postgres:
        condition: service_healthy
    networks:
      - trino-network

  # Create default lakekeeper warehouse and namespace
  lakekeeper-init:
      image: python:3.9-slim
      depends_on:
        lakekeeper:
          condition: service_healthy
        createbuckets:
          condition: service_completed_successfully
      volumes:
        - ./lakekeeper:/lakekeeper
      working_dir: /lakekeeper
      command: >
        sh -c "pip install requests && python init.py"
      networks:
        - trino-network

  # Trino Coordinator
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/trino/catalog:/etc/trino/catalog
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - trino-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Postgres for metabase
  metabase-postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ilaybor
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: 24342434
    networks:
      - trino-network
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
  
  # Metabase
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    ports:
      - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: ilaybor
      MB_DB_PASS: 24342434
      MB_DB_HOST: postgres
    networks:
      - trino-network
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - metabase-postgres

volumes:
  lakekeeper_postgres_data:
  mongodb_data:
  minio_data:
  metabase_postgres_data:
  
networks:
  trino-network:
    driver: bridge